services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: clearhold
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.deploy}
      POSTGRES_DB: clearhold
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clearhold -d clearhold"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      args:
        BACKEND_URL: http://backend:3001
    image: clearhold-app:local
    command: npm run db:migrate:deploy
    environment:
      DATABASE_URL: postgresql://clearhold:${POSTGRES_PASSWORD}@db:5432/clearhold
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    image: clearhold-app:local
    command: npm run start:backend
    restart: unless-stopped
    env_file: .env.deploy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://clearhold:${POSTGRES_PASSWORD}@db:5432/clearhold
      NEXTAUTH_URL: ${PUBLIC_URL:?Set PUBLIC_URL in .env.deploy}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    image: clearhold-app:local
    command: npm run start:frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BACKEND_URL: http://backend:3001
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/escrow',{redirect:'manual'}).then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    image: clearhold-app:local
    command: node scripts/reconcile-worker.mjs
    restart: unless-stopped
    env_file: .env.deploy
    environment:
      BACKEND_INTERNAL_URL: http://backend:3001
    depends_on:
      backend:
        condition: service_healthy

  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS in .env.deploy}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
